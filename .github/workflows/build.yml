# Build the pyexamine wheel + sdist and prove they install and import
# cleanly. On a `v*` tag the artefacts are also attached to a GitHub
# Release so downstream users can `pip install` a pinned wheel.
#
# Cut a release:
#   1. bump `version` in pyproject.toml, commit to main
#   2. git tag -a v0.1.0 -m "pyExaMINE 0.1.0" && git push origin v0.1.0
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel + sdist
        run: uv build

      # Install the wheel into a fresh venv from a directory that is NOT
      # the checkout, so the test can only succeed if the package (and
      # its bundled data/ CSVs) is self-contained.
      - name: Smoke-test wheel in a clean environment
        env:
          MPLBACKEND: Agg
        run: |
          uv venv /tmp/wheelvenv
          uv pip install --python /tmp/wheelvenv/bin/python dist/pyexamine-*.whl
          cd /tmp
          /tmp/wheelvenv/bin/python - <<'EOF'
          import pyexamine
          from pyexamine.model.supply_chain_model import MineralSupplyChainModel
          from pyexamine.config.lithium_config import LITHIUM_CONFIG
          from pyexamine.data import data_loader
          assert data_loader._DATA_DIR.name == "bundled", data_loader._DATA_DIR
          m = MineralSupplyChainModel(LITHIUM_CONFIG)
          for _ in range(20):
              m.step()
          print("pyexamine", pyexamine.__version__, "OK from wheel")
          EOF

      - name: Check the tag matches pyproject.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(sed -nE 's/^version = "([^"]+)"/\1/p' pyproject.toml)"
          if [ "$tag" != "$ver" ]; then
            echo "tag v$tag does not match pyproject.toml version $ver" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: dist
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
